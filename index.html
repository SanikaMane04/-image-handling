<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery with jQuery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Image Gallery</h1>
    <div class="filters">
        <button class="filter" data-filter="all">All</button>
        <button class="filter" data-filter="nature">Nature</button>
        <button class="filter" data-filter="city">City</button>
        <button class="filter" data-filter="animals">Animals</button>
    </div>

    <div class="gallery">
        <div class="item nature"><img src="https://sb.ecobnb.net/app/uploads/sites/3/2020/01/nature.jpg" alt="Nature 1"></div>
        <div class="item city"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT6odSAoKqBHJDD69pQexFpTOpd8uC6jNMNZQ&s" alt="City 1"></div>
        <div class="item animals"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS0TTbUfyAAANbPkNeRdfx7c_iMXWhFPhw5Rg&s" alt="Animals 1"></div>
        <div class="item nature"><img src="https://static.vecteezy.com/system/resources/previews/053/870/982/non_2x/rustic-blue-house-on-a-dirt-road-lush-greenery-stormy-sky-photo.jpeg" alt="Nature 2"></div>
        <div class="item city"><img src="https://burst.shopifycdn.com/photos/chicago-city-lights-at-night.jpg?width=1000&format=pjpg&exif=0&iptc=0" alt="City 2"></div>
        <div class="item animals"><img src="https://static.vecteezy.com/system/resources/thumbnails/042/730/459/small/lion-danger-animal-wildlife-nature-forest-photo.jpg" alt="Animals 2"></div>
    </div>

    <script src="jquery.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
